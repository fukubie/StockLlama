name: Bug report
description: Something does not work as described
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic games such as examples/demo.pgn. Do not paste API keys or private paths.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: input
    id: engine
    attributes:
      label: Stockfish version and coach provider
      placeholder: Stockfish 17, built-in coach
